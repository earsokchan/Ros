<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FlyMenu UI Preview — ROS DoggyMod 2.4.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  body { background:#111; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:24px; gap:16px; }
  h1 { color:#e02020; font-size:18px; }
  .hint { color:#777; font-size:12px; }
  /* Simulated iPhone screen */
  #screen {
    position:relative; width:390px; height:760px; overflow:hidden;
    border-radius:36px; border:6px solid #222;
    background:
      radial-gradient(circle at 30% 20%, rgba(224,32,32,.25), transparent 55%),
      radial-gradient(circle at 75% 75%, rgba(30,60,120,.35), transparent 60%),
      linear-gradient(160deg,#1a1d24,#0b0c10 60%,#14161c);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #screen::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="390" height="760"><text x="50%" y="50%" fill="rgba(255,255,255,0.05)" font-size="90" text-anchor="middle">ROS</text></svg>');
  }

  /* Floating logo button — 54x54 at (20,100), radius 27, red 2.5px border */
  #floatBtn {
    position:absolute; left:20px; top:100px; width:54px; height:54px;
    background:rgba(15,15,20,0.96); border:2.5px solid #d41d1d; border-radius:27px;
    cursor:grab; z-index:100; display:flex; align-items:center; justify-content:center;
    overflow:hidden; touch-action:none;
  }
  #floatBtn:active { cursor:grabbing; }
  #floatBtn img { width:100%; height:100%; object-fit:contain; border-radius:27px; }

  /* Menu panel — 280 x 345 */
  #panel {
    position:absolute; left:55px; top:200px; width:280px; height:345px;
    background:rgba(13,13,18,0.98); border:2px solid #d41d1d; border-radius:16px;
    overflow:hidden; z-index:90; display:none; touch-action:none;
  }
  #panel.show { display:block; }

  /* Header bar 280x42 */
  #header {
    position:absolute; left:0; top:0; width:280px; height:42px;
    background:#d41d1d; cursor:grab;
  }
  #header:active { cursor:grabbing; }
  #headerIcon { position:absolute; left:10px; top:7px; width:28px; height:28px; border-radius:6px; overflow:hidden; }
  #headerIcon img { width:100%; height:100%; object-fit:cover; }
  #headerTitle {
    position:absolute; left:46px; top:0; width:149px; height:42px;
    color:#fff; font-weight:700; font-size:14.5px; display:flex; align-items:center;
  }
  #closeBtn {
    position:absolute; left:242px; top:5px; width:32px; height:32px;
    background:transparent; border:none; color:#fff; font-size:18px; font-weight:700;
    cursor:pointer;
  }

  /* Tab bar — y 42, h 36 */
  #tabBar {
    position:absolute; left:0; top:42px; width:280px; height:36px; background:#141419;
  }
  .tab {
    position:absolute; top:5px; width:65px; height:26px;
    background:#1c1c26; color:#a6a6b3; border:none; border-radius:5px;
    font-size:11px; font-weight:700; cursor:pointer;
  }
  .tab.active { background:#d41d1d; color:#fff; }
  #tabDivider { position:absolute; left:0; top:35px; width:280px; height:1.5px; background:#d41d1d; }

  /* Feature rows — startY 84, rowH 38, gap 4, x 10, w 260 */
  .row {
    position:absolute; left:10px; width:260px; height:38px;
    background:#14141c; border:1px solid #24242e; border-radius:8px;
    cursor:pointer; overflow:hidden;
  }
  .row.on { border-color:#d41d1d; }
  .pill {
    position:absolute; left:10px; top:8px; width:36px; height:22px;
    background:#26262e; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:10px; font-weight:700;
    transition:background .12s;
  }
  .row.on .pill { background:#fff; }
  .row.on .pill.sym { color:#111; }
  .row .lbl {
    position:absolute; left:54px; top:0; width:202px; height:38px;
    display:flex; align-items:center; color:#fff; font-size:12.5px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row.dim .lbl, .row.dim .pill { opacity:.45; }

  /* Fake game HUD for context */
  .hud { position:absolute; color:rgba(255,255,255,.35); font-size:11px; z-index:1; }
</style>
</head>

      <div id="headerTitle">ikhozzzz vip</div>
      <button id="closeBtn">✕</button>
    </div>

    <div id="tabBar">
      <button class="tab" data-tab="0" style="left:4px;">🎯 Aim</button>
      <button class="tab" data-tab="1" style="left:72px;">👁 Esp</button>
      <button class="tab" data-tab="2" style="left:140px;">⚡ Fly</button>
      <button class="tab" data-tab="3" style="left:208px;">📇 Info</button>
      <div id="tabDivider"></div>
    </div>

    <!-- rows injected by JS -->
  </div>
</div>

<script>
// ---- State mirrors FlyMenu_UI.m core button titles ("... ON ..." detection) ----
const titles = [
  "Fly Hack (Zero Gravity)",
  "Flight Ascend (Up)",
  "Flight Descend (Down)",
  "Aimbot 360 Lock",
  "Esp Player Laser & Box",
  "Flight Diagnostics & Info"
];
const symbols = [ "", "▲", "▼", "", "", "ℹ" ];
const tabFilter = { 0:[3], 1:[4], 2:[0,1,2], 3:[5] }; // Aim/Esp/Fly/Info

const state = { fly:false, aim:false, esp:false, tab:-1, upHeld:false, downHeld:false };
const panel = document.getElementById('panel');
const floatBtn = document.getElementById('floatBtn');

// Build 6 rows
const rows = titles.map((t,i) => {
  const r = document.createElement('div');
  r.className = 'row';
  r.dataset.idx = i;
  r.innerHTML = `<div class="pill${symbols[i]?' sym':''}">${symbols[i]||''}</div><div class="lbl">${t}</div>`;
  panel.appendChild(r);
  r.addEventListener('click', () => {
    if (i === 0) state.fly = !state.fly;
    else if (i === 3) state.aim = !state.aim;
    else if (i === 4) state.esp = !state.esp;
    else if (i === 5) { /* Info: momentary */ }
    render();
  });
  // Up/Down hold feedback (isHighlighted equivalent)
  if (i === 1 || i === 2) {
    const key = i === 1 ? 'upHeld' : 'downHeld';
    r.addEventListener('pointerdown', () => { state[key] = true; render(); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev =>
      r.addEventListener(ev, () => { state[key] = false; render(); }));
  }
  return r;
});

// Tabs — same toggle-to-show-all behavior as selectTab_imp
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = +btn.dataset.tab;
    state.tab = (state.tab === t) ? -1 : t;
    render();
  });
});

// Layout: updateRowLayout() + updateRowStates()
function render() {
  const startY = 84, rowH = 38, gap = 4;
  let visible = 0;
  rows.forEach((r,i) => {
    const show = state.tab === -1 || tabFilter[state.tab].includes(i);
    r.style.display = show ? 'block' : 'none';
    if (show) { r.style.top = (startY + visible*(rowH+gap)) + 'px'; visible++; }

    const on = (i===0 && state.fly) || (i===3 && state.aim) || (i===4 && state.esp);
    r.classList.toggle('on', on);

    // Up/Down: pressed pill turns red, dimmed when fly is off
    if (i===1 || i===2) {
      const held = (i===1 && state.upHeld) || (i===2 && state.downHeld);
      r.querySelector('.pill').style.background = held ? '#d41d1d' : '';
      r.classList.toggle('dim', !state.fly);
    }
  });
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('active', +b.dataset.tab === state.tab));
}

// Panel open/close (toggleMenu_imp / closeMenu_imp)
floatBtn.addEventListener('click', e => {
  if (dragMoved) return;
  panel.classList.toggle('show');
});
document.getElementById('closeBtn').addEventListener('click', () => panel.classList.remove('show'));

// Dragging (handleFloatPan_imp / handleMenuPan_imp)
function makeDraggable(el, getX, getY, setPos) {
  let sx=0, sy=0, ox=0, oy=0, dragging=false;
  el.addEventListener('pointerdown', e => {
    dragging = true; dragMoved = false;
    sx = e.clientX; sy = e.clientY; ox = getX(); oy = getY();
    el.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
    setPos(ox + dx, oy + dy);
  });
  ['pointerup','pointercancel'].forEach(ev => el.addEventListener(ev, () => dragging = false));
}
let dragMoved = false;
const screen = document.getElementById('screen');

makeDraggable(floatBtn,
  () => floatBtn.offsetLeft, () => floatBtn.offsetTop,
  (x,y) => {
    x = Math.max(0, Math.min(390-54, x)); y = Math.max(0, Math.min(760-54, y));
    floatBtn.style.left = x+'px'; floatBtn.style.top = y+'px';
  });

const header = document.getElementById('header');
makeDraggable(header,
  () => panel.offsetLeft, () => panel.offsetTop,
  (x,y) => {
    x = Math.max(-40, Math.min(390-240, x)); y = Math.max(0, Math.min(760-60, y));
    panel.style.left = x+'px'; panel.style.top = y+'px';
  });
// Clicking header (without drag) shouldn't toggle; only floatBtn toggles

render();
</script>
